<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telar euclidiano</title>
  <style>
    body {
      --foreground: #585050;
      --background: #efe6d2;
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
      color: #b1d1f5;
      color: var(--foreground);
      font: 12px monospace;
    }
    canvas { display: block; }

    #panel {
      width: 220px;
      flex-shrink: 0;
      padding: 30px 24px;
      border-right: 1px solid var(--foreground);
    }
    #lienzo { flex: 1; overflow: hidden; }

    h1 { font-size: 13px; font-weight: normal; margin: 0 0 30px; text-transform: uppercase; }
    h2 { font-size: 11px; font-weight: normal; margin: 0 0 12px; text-transform: uppercase; }
    section { margin-bottom: 34px; }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    input, select {
      width: 80px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--foreground);
    }
    input:disabled { opacity: 0.4; }
    button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 7px 0;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--foreground);
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { 
      background: var(--foreground); 
      color: var(--background); 
    }
    #modo { 
      display: flex; 
      margin-bottom: 16px;
    }
    #modo button { 
      flex: 1; 
      opacity: 0.6; 
    }
    #modo button + button {
      border-left: none; 
    }
    #modo button.activo { 
      opacity: 1; 
      background: var(--foreground); 
      color: var(--background); 
    }
    small { 
      display: block; 
      margin-top: 6px; 
      opacity: 0.7; 
    }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>

<aside id="panel">
  <h1>Telar euclidiano</h1>

  <section>
    <label>grosor (px) <input id="grosor" type="number" min="1" value="16"></label>

  </section>
  <div id="modo">
      <button data-modo="aleatorio" class="activo">Aleatorio</button>
      <button data-modo="custom">Custom</button>
    </div>
  <section id="sAleatorio">
    <h2>Aleatorio</h2>
    <label>cant. colores <input id="aColores" type="number" min="2" max="4" value="3"></label>
    <label>n mín <input id="aMin" type="number" min="2" value="2"></label>
    <label>n máx <input id="aMax" type="number" min="2" value="29"></label>
    <label>acento <input id="aAcento" type="checkbox"></label>
    <!-- <label>modo
      <select id="aModo">
        <option value="aleatorio">aleatorio</option>
        <option value="igual">igual</option>
        <option value="distinto">distinto</option>
      </select>
    </label> -->
    <button id="bAleatorio">Generar</button>
    <small>tecla R</small>
  </section>

  <section id="sCustom" hidden>
    <h2>Custom</h2>
    <label>n (total pasos) <input id="eN" type="number" min="2" value="31"></label>
    <label>k (cambios de color)<input id="eK" type="number" min="1" value="9"></label>
    <label>a (acento) <input id="eA" type="number" min="0" value="7"></label>
    <label>cant. colores <input id="eColores" type="number" min="2" max="4" value="4"></label>
    <button id="bExacto">Generar</button>
    <small>mismo E(k,n) en urdimbre y trama · acento 0 = sin acento</small>
  </section>

  <section>
    <!-- <h2>Guardar</h2> -->
    <!-- <button id="bTile">Guardar tile</button> -->
    <button id="bCompleto">Guardar</button>
    <!-- <small>teclas T · G</small> -->
  </section>
</aside>

<main id="lienzo"></main>

<script>
// =====================================================
// TELAR EUCLIDIANO (p5.js)
// cada 1 = color siguiente · los 0 siguen el color de ese 1
// urdimbre y trama con patrón propio, compartido o al azar
// animación: urdimbres crecen de arriba hacia abajo,
// después tramas crecen de derecha a izquierda en tafetán
// Teclas: R nueva receta · G guardar png · T guardar tile repetible
// =====================================================

const CONFIG = {
  grosor: 16,           // px por hilo · la cantidad de hilos sale del tamaño de pantalla
  nColores: 3,         // colores que alternan
  nMin: 2,             // rango de n
  nMax: 29,
  modo: 'aleatorio',   // 'igual' | 'distinto' | 'aleatorio'
  acento: false,       // aleatorio: sortea a entre 1 y k - 1
  tiempoHilo: 10,     // ms que tarda cada hilo en crecer
  margen: 30,          // margen interno de la leyenda
};

const PALETA = ['#b1d1f5', '#efa5e4', '#d8f707', '#8a5a2b'];
const FONDO = '#efe6d2';
const TEXTO = '#585050';
const ALTO_LEYENDA = 100;   // banda blanca abajo, encima del tejido

let colores, urdimbre, trama, comparten;
let fase, hilo, t0;   // fase: 'urdimbre' | 'trama' | 'fin'

// ---------- EUCLIDES ----------
function Euclides(k, n) {
  let a = Array.from({ length: k }, () => [1]);
  let b = Array.from({ length: n - k }, () => [0]);
  while (b.length > 1) {
    const m = min(a.length, b.length);
    const unidos = [];
    for (let i = 0; i < m; i++) unidos.push(a[i].concat(b[i]));
    b = a.length > m ? a.slice(m) : b.slice(m);
    a = unidos;
  }
  return a.concat(b).flat();
}

function mcd(a, b) {
  while (b) [a, b] = [b, a % b];
  return a;
}

function mcm(a, b) {
  return a * b / mcd(a, b);
}

// hilos hasta que el color vuelve al inicio
// con acento solo alternan los 2 colores base, que avanzan k - a por vuelta
function periodo(S) {
  if (S.a) return S.n * 2 / mcd(S.k - S.a, 2);
  return S.n * CONFIG.nColores / mcd(S.k, CONFIG.nColores);
}

// ---------- RECETA ----------
function Patron() {
  const n = floor(random(CONFIG.nMin, CONFIG.nMax + 1));
  const k = floor(random(1, n));            // 1 a n - 1
  const a = CONFIG.acento && k > 1 ? floor(random(1, k)) : 0;   // 1 a k - 1, sin acento si k = 1
  return { k, n, a, secuencia: Acento(Euclides(k, n), k, a) };
}

// 1000101000 → 1000 color 1 · 10 color 2 ...
function ColoresHilos(p, total) {
  if (p.a) return ColoresHilosAcento(p, total);
  const hilos = [];
  let colorActual = -1;                     // el primer 1 lo lleva a 0
  let Indice = 0;
  while (Indice < total) {
    if (p.secuencia[Indice % p.n] === 1) colorActual = (colorActual + 1) % CONFIG.nColores;
    hilos[Indice] = colores[colorActual];
    Indice++;
  }
  return hilos;
}

// ---------- ACENTO ----------
// principal E(k,n), acento E(a,k): el acento se reparte sobre los k unos
// E(5,8) = 10110110 · E(2,5) = 10100 → 20120110
// a = 0: sin acento, la secuencia queda igual
function Acento(secuencia, k, a) {
  if (!a) return secuencia;
  const acento = Euclides(a, k);
  let uno = 0;                              // cuántos 1 van recorridos
  return secuencia.map(x => x === 1 ? (acento[uno++] ? 2 : 1) : 0);
}

// con acento: 2 colores para la base y 1 extra para los 2
// cada 1 alterna entre los 2 colores base · cada 2 pinta el color acento
// los 0 mantienen el último color
function ColoresHilosAcento(p, total) {
  const hilos = [];
  let colorActual = -1;
  let colorBase = -1;
  let Indice = 0;
  while (Indice < total) {
    const x = p.secuencia[Indice % p.n];
    if (x === 1) colorActual = colorBase = (colorBase + 1) % 2;
    if (x === 2) colorActual = 2;
    hilos[Indice] = colores[colorActual];
    Indice++;
  }
  return hilos;
}

function NuevaReceta() {
  colores = shuffle(PALETA).slice(0, CONFIG.nColores);
  const pU = Patron();
  comparten = CONFIG.modo === 'igual' || (CONFIG.modo === 'aleatorio' && random() < 0.5);
  const pT = comparten ? pU : Patron();
  Tejer(pU, pT);
}

// k y n dados por el usuario, mismo patrón en urdimbre y trama
function RecetaExacta(k, n, a) {
  colores = shuffle(PALETA).slice(0, CONFIG.nColores);
  const p = { k, n, a, secuencia: Acento(Euclides(k, n), k, a) };
  comparten = true;
  Tejer(p, p);
}

// el patrón se repite hasta cubrir el lienzo
function Tejer(pU, pT) {
  urdimbre = { ...pU, hilos: ColoresHilos(pU, ceil(width / CONFIG.grosor)) };
  trama = { ...pT, hilos: ColoresHilos(pT, ceil(height / CONFIG.grosor)) };

  fase = 'urdimbre';
  hilo = 0;
  t0 = millis();
  loop();
}

// ---------- p5 ----------
// todo lo que queda a la derecha del panel
function tamañoLienzo() {
  return [windowWidth - document.getElementById('panel').offsetWidth, windowHeight];
}

function setup() {
  createCanvas(...tamañoLienzo()).parent('lienzo');
  textFont('monospace');
  noStroke();
  NuevaReceta();
}

// misma receta, recalcula cuántos hilos entran y vuelve a tejer
function windowResized() {
  resizeCanvas(...tamañoLienzo());
  Tejer(urdimbre, trama);
}

function draw() {
  background(FONDO);
  const g = CONFIG.grosor, m = CONFIG.margen;
  const totalU = urdimbre.hilos.length, totalT = trama.hilos.length;
  const progreso = constrain((millis() - t0) / CONFIG.tiempoHilo, 0, 1);

  // URDIMBRES: crecen de arriba hacia abajo
  const nU = fase === 'urdimbre' ? hilo : totalU;
  for (let i = 0; i < nU; i++) {
    fill(urdimbre.hilos[i]);
    rect(i * g, 0, g, height);
  }
  if (fase === 'urdimbre') {
    fill(urdimbre.hilos[hilo]);
    rect(hilo * g, 0, g, height * progreso);
  }

  // TRAMAS: crecen de derecha a izquierda, tafetán
  const nT = fase === 'trama' ? hilo : fase === 'fin' ? totalT : 0;
  for (let j = 0; j < nT; j++) dibujarTrama(j, 1);
  if (fase === 'trama') dibujarTrama(hilo, progreso);

  // LEYENDA: banda blanca abajo, encima del tejido
  const y0 = height - ALTO_LEYENDA;
  fill(255);
  rect(0, y0, width, ALTO_LEYENDA);
  leyenda('URDIMBRE', urdimbre, m, y0 + 20);
  leyenda('TRAMA   ', trama, m, y0 + 45);

  // avanzar al siguiente hilo
  if (fase !== 'fin' && progreso >= 1) {
    hilo++;
    t0 = millis();
    if (fase === 'urdimbre' && hilo >= totalU) { fase = 'trama'; hilo = 0; }
    else if (fase === 'trama' && hilo >= totalT) { fase = 'fin'; noLoop(); }
  }
}

// trama j: solo se pinta en los cruces donde va adelante
function dibujarTrama(j, progreso) {
  const g = CONFIG.grosor;
  const x0 = width * (1 - progreso);        // borde izquierdo de lo que ya entró
  fill(trama.hilos[j]);
  for (let i = 0; i < urdimbre.hilos.length; i++) {
    if ((j + i) % 2 === 0) continue;        // urdimbre adelante
    const a = max(i * g, x0);
    const b = (i + 1) * g;
    if (b > a) rect(a, j * g, b - a, g);
  }
}

// período completo: casilla = color, punto = 1, línea = reinicio de secuencia
function leyenda(nombre, S, x, y) {
  const largo = min(periodo(S), S.hilos.length);
  const x0 = x + 190;
  const s = min(14, (width - x0 - CONFIG.margen) / largo - 2);

  fill(TEXTO);
  textSize(11);
  text(`${nombre} E(${S.k},${S.n})` + (S.a ? ` E(${S.a},${S.k})` : ''), x, y + 10);

  for (let i = 0; i < largo; i++) {
    const cx = x0 + i * (s + 2);
    fill(S.hilos[i]);
    rect(cx, y, s, 14);
    fill(TEXTO);
    if (S.secuencia[i % S.n]) circle(cx + s / 2, y + 7, min(4, s * 0.6));
    if (i > 0 && i % S.n === 0) rect(cx - 2, y - 3, 1, 20);
  }
}

// ---------- GUARDAR ----------
function descargar(canvasEl, nombre) {
  const link = document.createElement('a');
  link.download = nombre + '.png';
  link.href = canvasEl.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// k,n en el nombre: un solo par si urdimbre y trama son iguales
// con acento se agrega a: 5,8,a2
function nombreArchivo(extra) {
  const ejes = S => `${S.k},${S.n}` + (S.a ? `,a${S.a}` : '');
  const u = ejes(urdimbre);
  const t = ejes(trama);
  return `telar-euclidiano${extra}-` + (u === t ? u : `u${u}-t${t}`);
}

// ancho = mcm(período urdimbre, 2) · alto = mcm(período trama, 2)
// el 2 es por el tafetán (ajedrez)
function tamañoTile() {
  return { w: mcm(periodo(urdimbre), 2), h: mcm(periodo(trama), 2) };
}

function GuardarTile() {
  const { w, h } = tamañoTile();
  const g = CONFIG.grosor;
  const colU = ColoresHilos(urdimbre, w);   // colores recalculados al largo del tile
  const colT = ColoresHilos(trama, h);

  const pg = createGraphics(w * g, h * g);
  pg.pixelDensity(1);                       // 1 px real = 1 px
  pg.noStroke();
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      pg.fill((i + j) % 2 === 0 ? colU[i] : colT[j]);
      pg.rect(i * g, j * g, g, g);
    }
  }
  descargar(pg.elt, nombreArchivo('-tile'));
  pg.remove();
}

function GuardarCompleto() {
  descargar(drawingContext.canvas, nombreArchivo(''));
}

// ---------- PANEL ----------
function valor(id) {
  return parseInt(document.getElementById(id).value, 10);
}

// grosor es general: vale para aleatorio y exacto
function LeerGrosor() {
  CONFIG.grosor = max(1, valor('grosor') || 1);
  document.getElementById('grosor').value = CONFIG.grosor;
}

function GenerarAleatorio() {
  LeerGrosor();
  CONFIG.acento = document.getElementById('aAcento').checked;
  // con acento: 2 colores base + 1 acento, cant. colores no se usa
  CONFIG.nColores = CONFIG.acento ? 3 : constrain(valor('aColores') || 2, 2, PALETA.length);
  CONFIG.nMin = max(2, valor('aMin') || 2);
  CONFIG.nMax = max(CONFIG.nMin, valor('aMax') || CONFIG.nMin);
  CONFIG.modo = 'igual' //document.getElementById('aModo').value;
  NuevaReceta();
}

function GenerarExacto() {
  LeerGrosor();
  const n = max(2, valor('eN') || 2);
  const k = constrain(valor('eK') || 1, 1, n - 1);   // 1 a n - 1
  document.getElementById('eN').value = n;
  document.getElementById('eK').value = k;
  const a = constrain(valor('eA') || 0, 0, k - 1);   // 0 = sin acento
  document.getElementById('eA').value = a;
  BloquearColores();
  CONFIG.nColores = a ? 3 : constrain(valor('eColores') || 2, 2, PALETA.length);
  RecetaExacta(k, n, a);
}

// activa un botón del toggle y muestra solo la sección de ese modo
function MostrarSeccion(m) {
  document.querySelectorAll('#modo button').forEach(b => b.classList.toggle('activo', b.dataset.modo === m));
  document.getElementById('sAleatorio').hidden = m !== 'aleatorio';
  document.getElementById('sCustom').hidden = m !== 'custom';
}

// con acento la cantidad de colores es fija (2 base + 1 acento)
function BloquearColores() {
  document.getElementById('aColores').disabled = document.getElementById('aAcento').checked;
  document.getElementById('eColores').disabled = valor('eA') > 0;
}

document.querySelectorAll('#modo button').forEach(b => b.onclick = () => MostrarSeccion(b.dataset.modo));
document.getElementById('aAcento').onchange = BloquearColores;
document.getElementById('eA').oninput = BloquearColores;
BloquearColores();
// cambiar el grosor vuelve a tejer la misma receta
document.getElementById('grosor').onchange = () => { LeerGrosor(); Tejer(urdimbre, trama); };
document.getElementById('bAleatorio').onclick = GenerarAleatorio;
document.getElementById('bExacto').onclick = GenerarExacto;
// document.getElementById('bTile').onclick = GuardarTile;
document.getElementById('bCompleto').onclick = GuardarCompleto;

function keyPressed() {
  if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
  const k = key.toLowerCase();
  if (k === 'r') GenerarAleatorio();
  if (k === 'g') GuardarCompleto();
  // if (k === 't') GuardarTile();
}
</script>
</body>
</html>
