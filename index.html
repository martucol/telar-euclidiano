<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telar euclidiano</title>
  <style>
    body {
      --foreground: #585050;
      --background: #efe6d2;
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
      color: #b1d1f5;
      color: var(--foreground);
      font: 12px monospace;
    }
    canvas { display: block; }

    #panel {
      width: 220px;
      flex-shrink: 0;
      padding: 30px 24px;
      border-right: 1px solid var(--foreground);
      display: flex;
      flex-direction: column;
    }
    #leyenda {
      margin-top: auto;
      margin-bottom: 0;
    }
    /* receta: E(k,n) E(a,k), arriba de la línea que la separa de guardar */
    #receta {
      margin: 0;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--foreground);
      font-size: 16px;
    }
    #lienzo { flex: 1; overflow: hidden; }

    h1 { font-size: 13px; font-weight: normal; margin: 0 0 30px; text-transform: uppercase; }
    h2 { font-size: 11px; font-weight: normal; margin: 0 0 12px; text-transform: uppercase; }
    section { margin-bottom: 34px; }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    input {
      width: 80px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--foreground);
    }
    button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 7px 0;
      font: inherit;
      color: var(--background);
      background: var(--foreground);
      border: 1px solid var(--foreground);
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { opacity: 0.6; }
    /* tabs aleatorio / custom: línea abajo, la activa se abre como solapa */
    #modo { 
      display: flex; 
      margin-bottom: 16px;
      border-bottom: 1px solid var(--foreground);
    }
    #modo button { 
      flex: 1; 
      margin-top: 0;
      color: inherit;
      background: transparent;
      border-color: transparent;
      border-bottom: none;
      opacity: 0.6; 
    }
    #modo button:hover { opacity: 1; }
    #modo button.activo { 
      opacity: 1; 
      margin-bottom: -1px;
      background: var(--background);
      border-color: var(--foreground);
    }
    summary { cursor: pointer; margin-bottom: 8px; }
    #muestras { float: right; }
    .muestra {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-left: 2px;
      border: 1px solid var(--foreground);
    }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>

<aside id="panel">
  <h1>Telar euclidiano</h1>

  <section>
    <!-- paleta: cerrada muestra los cuadraditos, abierta la lista de hex (máximo 6, vacío = no se usa) -->
    <details id="paleta">
      <summary>paleta <span id="muestras"></span></summary>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
      <label><input placeholder="#ffffff"><span class="muestra"></span></label>
    </details>
    <label>grosor (px) <input id="grosor" type="number" min="1" value="16"></label>

  </section>
  <div id="modo">
      <button data-modo="aleatorio" class="activo">Aleatorio</button>
      <button data-modo="custom">Custom</button>
    </div>
  <section id="sAleatorio">
    <h2>Aleatorio</h2>
    <label>cant. colores <input id="aColores" type="number" min="2" max="6" value="3"></label>
    <label>n mín <input id="aMin" type="number" min="3" value="3"></label>
    <label>n máx <input id="aMax" type="number" min="2" value="29"></label>
    <label>acento <input id="aAcento" type="checkbox"></label>
    <button id="bAleatorio">Generar (r)</button>
  </section>

  <section id="sCustom" hidden>
    <h2>Custom</h2>
    <label>n (total pasos) <input id="eN" type="number" min="2" value="31"></label>
    <label>k (cambios de color)<input id="eK" type="number" min="1" value="9"></label>
    <label>a (acento) <input id="eA" type="number" min="0" value="7"></label>
    <label>cant. colores <input id="eColores" type="number" min="2" max="6" value="4"></label>
    <button id="bExacto">Generar (r)</button>
  </section>

  <section id="leyenda">
    <p id="receta"></p>
    <button id="bCompleto">Guardar PNG (g)</button>
    <button id="bTile">Guardar tile (t)</button>
  </section>
</aside>

<main id="lienzo"></main>

<script>
// =====================================================
// TELAR EUCLIDIANO (p5.js) · herramienta online
// mismo algoritmo que auto.html (Anexo B), con:
// - parámetros desde el panel, acento opcional
// - leyenda en el panel, guardar canvas (png) y tile repetible (svg)
// Teclas: R generar (según el modo activo) · G guardar png · T guardar tile svg
// =====================================================

// ---------- PARÁMETROS INICIALES ----------
const CONFIG = {
  grosorHilo: 16,      // px por "hilo". la cantidad de "hilos" horizontales y verticales se calcula a partir del ancho / alto del lienzo
  nColores: 3,         // se eligen aleatoriamente de la paleta. con acento: 1 para el acento, el resto para la base. sin acento: todos base
  nMin: 3,             // minimo valor para n, como minimo 3 porque k tiene que ser al menos 2 para que haya acento
  nMax: 29,            // maximo valor para n
  acento: false,       // con acento: a entre 1 y k - 1 · sin acento: a = 0
  tiempoHilo: 10,      // ms que tarda cada hilo en dibujarse
  paletaColores: ['#b1d1f5', '#efa5e4', '#d8f707', '#8a5a2b'],
  colorFondo: '#efe6d2',
};

// ---------- VARIABLES ----------
let cantHilosUrdimbre;  // anchoLienzo / grosorHilo, redondeado hacia arriba
let cantHilosTrama;     // altoLienzo / grosorHilo, redondeado hacia arriba
let coloresBase = [];   // los colores base elegidos de la paleta para este patrón
let colorAcento;        // color de acento elegido de la paleta para este patron
let patron;             // { n, k, a, secuencia }, el mismo para urdimbre y trama
let urdimbre = [];      // secuencia de color de cada hilo vertical, de izquierda a derecha, de cantHilosUrdimbre posiciones
let trama = [];         // secuencia de color de cada hilo horizontal, de arriba hacia abajo, de cantHilosTrama posiciones
let fase;               // en qué parte de la animación de tejido estamos: 'urdimbre' | 'trama' | 'fin'
let hiloActual;         // índice del hilo que se está dibujando ahora en la fase actual
let t0;                 // momento en que arrancó el hilo actual, para calcular porcentajeHiloDibujado

// ---------- ALGORITMO ----------
// modo aleatorio: n, k y a al azar
function inicializarPatron() {
  elegirColores();
  patron = generarPatron();
  tejer();
}

// modo custom: k, n y a dados por el usuario
function patronExacto(k, n, a) {
  elegirColores();
  patron = crearPatron(k, n, a);
  tejer();
}

function elegirColores() {
  const colores = shuffle(CONFIG.paletaColores).slice(0, CONFIG.nColores);
  colorAcento = colores[0];
  coloresBase = CONFIG.acento ? colores.slice(1) : colores;   // sin acento todos los colores son base
}

function generarPatron() {
  const n = floor(random(CONFIG.nMin, CONFIG.nMax + 1));    // nMin a nMax
  const k = floor(random(2, n));                            // 2 a n - 1
  const a = CONFIG.acento ? floor(random(1, k)) : 0;        // 1 a k - 1 · 0 = sin acento
  return crearPatron(k, n, a);
}

function crearPatron(k, n, a) {
  const secuenciaInicial = secuenciaEuclides(k, n);
  const secuencia = agregarAcento(secuenciaInicial, k, a);
  return { n, k, a, secuencia };
}

// fórmula modular: en el paso i va un 1 si (i * k) % n < k, si no un 0
// E(3,8) = 10010010
function secuenciaEuclides(k, n) {
  const resultado = [];
  for (let i = 0; i < n; i++) resultado.push((i * k) % n < k ? 1 : 0);
  return resultado;
}

// secuencia principal E(k,n), secuencia acento E(a,k): el acento se reparte sobre los k unos
// a = 0: E(0,k) es todo 0, la secuencia queda sin acentos
function agregarAcento(secuenciaPrincipal, k, a) {
  const secuenciaAcento = secuenciaEuclides(a, k);
  let indiceK = 0;                          // cuántos 1 de la secuencia principal van recorridos
  for (let i = 0; i < secuenciaPrincipal.length; i++) {
    if (secuenciaPrincipal[i] === 1) {
      if (secuenciaAcento[indiceK] === 1) secuenciaPrincipal[i] = 2;
      indiceK++;
    }
  }
  return secuenciaPrincipal;
}

// 1 → siguiente color base · 2 → color acento · 0 → mantiene el color anterior
function calcularSecuenciaColores(cantTotalPasos) {
  const secuenciaColores = [];
  let indiceColorBase = 0;                  // posición dentro de coloresBase
  let colorActual;                          // el color que se le asigna a cada posicion
  let indice = 0;
  while (indice < cantTotalPasos) {
    const paso = patron.secuencia[indice % patron.n];
    if (paso === 1) {
      indiceColorBase = (indiceColorBase + 1) % coloresBase.length;
      colorActual = coloresBase[indiceColorBase];
    }
    if (paso === 2) {
      colorActual = colorAcento;
    }
    secuenciaColores[indice] = colorActual;
    indice++;
  }
  return secuenciaColores;
}

// colores de cada hilo para el tamaño actual y arranca la animación
function tejer() {
  urdimbre = calcularSecuenciaColores(cantHilosUrdimbre);
  trama = calcularSecuenciaColores(cantHilosTrama);
  actualizarLeyenda();
  fase = 'urdimbre';
  hiloActual = 0;
  t0 = millis();
  loop();
}

// ---------- PERÍODO Y TILE ----------
function mcd(a, b) {
  while (b) [a, b] = [b, a % b];
  return a;
}

function mcm(a, b) {
  return a * b / mcd(a, b);
}

// hilos hasta que el color vuelve al inicio
// por vuelta hay k - a unos, cada uno avanza un color base
function periodo() {
  return patron.n * coloresBase.length / mcd(patron.k - patron.a, coloresBase.length);
}

// ---------- INICIO ----------
// todo lo que queda a la derecha del panel
function tamañoLienzo() {
  return [windowWidth - document.getElementById('panel').offsetWidth, windowHeight];
}

function setup() {
  createCanvas(...tamañoLienzo()).parent('lienzo');
  noStroke();
  background(CONFIG.colorFondo);
  calcularCantHilos();
  inicializarPatron();
}

// mismo patrón, recalcula cuántos hilos entran y vuelve a tejer
function windowResized() {
  resizeCanvas(...tamañoLienzo());
  background(CONFIG.colorFondo);
  calcularCantHilos();
  tejer();
}

function calcularCantHilos() {
  cantHilosUrdimbre = ceil(width / CONFIG.grosorHilo);
  cantHilosTrama = ceil(height / CONFIG.grosorHilo);
}

// ---------- BUCLE (cada frame) ----------
// sin background(): cada frame pinta solo el hilo que está creciendo
function draw() {
  const ahora = millis();
  const g = CONFIG.grosorHilo;

  const porcentajeHiloDibujado = min((ahora - t0) / CONFIG.tiempoHilo, 1);

  if (fase === 'urdimbre') {
    // URDIMBRES: crecen de arriba (y = 0) hacia abajo
    fill(urdimbre[hiloActual]);
    rect(hiloActual * g, 0, g, height * porcentajeHiloDibujado);
  }

  if (fase === 'trama') {
    // TRAMAS: crecen de izquierda a derecha, tafetán
    // solo se pinta en los cruces donde la trama va adelante de la urdimbre
    // cada cruce es un cuadrado de grosorHilo px de lado
    const cantCrucesADibujar = floor(cantHilosUrdimbre * porcentajeHiloDibujado);
    fill(trama[hiloActual]);
    for (let i = 0; i < cantCrucesADibujar; i++) {
      if ((hiloActual + i) % 2 === 0) {
        // no dibujar la trama, la urdimbre va adelante
      } else {
        // dibujar el cruce de la trama sobre la urdimbre
        rect(i * g, hiloActual * g, g, g);
      }
    }
  }

  if (porcentajeHiloDibujado === 1) {
    // si ya se completó este hilo, pasar al siguiente
    hiloActual++;
    t0 = ahora;
    if (fase === 'urdimbre' && hiloActual === cantHilosUrdimbre) {
      fase = 'trama';
      hiloActual = 0;
    }
    if (fase === 'trama' && hiloActual === cantHilosTrama) {
      fase = 'fin';
      noLoop();   // queda el tejido terminado hasta el próximo patrón
    }
  }
}

// ---------- LEYENDA ----------
// receta en el panel: E(k,n), y E(a,k) si tiene acento
function actualizarLeyenda() {
  document.getElementById('receta').textContent =
    `E(${patron.k},${patron.n})` + (patron.a ? ` E(${patron.a},${patron.k})` : '');
}

// ---------- GUARDAR ----------
// url: dataURL del archivo · nombre: con extensión
function descargar(url, nombre) {
  const link = document.createElement('a');
  link.download = nombre;
  link.href = url;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// k,n en el nombre, con acento se agrega a: 5,8,a2
function nombreArchivo(extra) {
  return `telar-euclidiano${extra}-${patron.k},${patron.n}` + (patron.a ? `,a${patron.a}` : '');
}

// lado = mcm(período, 2), el 2 es por el tafetán (ajedrez)
// urdimbre y trama tienen el mismo patrón, así que el tile es cuadrado
function tamañoTile() {
  return mcm(periodo(), 2);
}

// tile: módulo mínimo que se repite sin cortes, en svg
// cada cruce es un cuadrado de 1 x 1 en el viewBox, el tamaño en px sale de grosorHilo
function guardarTile() {
  const lado = tamañoTile();
  const g = CONFIG.grosorHilo;
  const colores = calcularSecuenciaColores(lado);   // colores recalculados al largo del tile, valen para urdimbre y trama

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${lado * g}" height="${lado * g}" viewBox="0 0 ${lado} ${lado}" shape-rendering="crispEdges">`;
  for (let j = 0; j < lado; j++) {
    for (let i = 0; i < lado; i++) {
      // tafetán: (fila + col) par → urdimbre adelante, impar → trama adelante
      const color = (i + j) % 2 === 0 ? colores[i] : colores[j];
      svg += `<rect x="${i}" y="${j}" width="1" height="1" fill="${color}"/>`;
    }
  }
  svg += '</svg>';
  descargar('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), nombreArchivo('-tile') + '.svg');
}

// guarda lo que está en pantalla tal cual
function guardarCompleto() {
  descargar(drawingContext.canvas.toDataURL('image/png'), nombreArchivo('') + '.png');
}

// ---------- PANEL ----------
// lee los hex válidos de la paleta y pinta los cuadraditos
// con menos de 2 colores válidos se mantiene la paleta anterior
function leerPaleta() {
  const colores = [];
  document.querySelectorAll('#paleta input').forEach(input => {
    const hex = input.value.trim();
    const valido = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex);
    input.nextElementSibling.style.background = valido ? hex : 'transparent';
    if (valido) colores.push(hex);
  });
  document.getElementById('muestras').innerHTML =
    colores.map(c => `<span class="muestra" style="background:${c}"></span>`).join('');
  if (colores.length >= 2) CONFIG.paletaColores = colores;
}

function valor(id) {
  return parseInt(document.getElementById(id).value, 10);
}

// grosor es general: vale para aleatorio y custom
function leerGrosor() {
  CONFIG.grosorHilo = max(1, valor('grosor') || 1);
  document.getElementById('grosor').value = CONFIG.grosorHilo;
  calcularCantHilos();
}

function generarAleatorio() {
  leerGrosor();
  CONFIG.acento = document.getElementById('aAcento').checked;
  CONFIG.nColores = constrain(valor('aColores') || 2, 2, CONFIG.paletaColores.length);
  CONFIG.nMin = max(3, valor('aMin') || 3);
  CONFIG.nMax = max(CONFIG.nMin, valor('aMax') || CONFIG.nMin);
  inicializarPatron();
}

function generarExacto() {
  leerGrosor();
  const n = max(2, valor('eN') || 2);
  const k = constrain(valor('eK') || 1, 1, n - 1);   // 1 a n - 1
  const a = constrain(valor('eA') || 0, 0, k - 1);   // 0 = sin acento
  document.getElementById('eN').value = n;
  document.getElementById('eK').value = k;
  document.getElementById('eA').value = a;
  CONFIG.acento = a > 0;
  CONFIG.nColores = constrain(valor('eColores') || 2, 2, CONFIG.paletaColores.length);
  patronExacto(k, n, a);
}

// R equivale a tocar Generar en la sección que está visible
function generar() {
  if (document.getElementById('sCustom').hidden) generarAleatorio();
  else generarExacto();
}

// activa un botón del toggle y muestra solo la sección de ese modo
function mostrarSeccion(m) {
  document.querySelectorAll('#modo button').forEach(b => b.classList.toggle('activo', b.dataset.modo === m));
  document.getElementById('sAleatorio').hidden = m !== 'aleatorio';
  document.getElementById('sCustom').hidden = m !== 'custom';
}

// la paleta inicial sale de CONFIG, los cambios se aplican al generar
document.querySelectorAll('#paleta input').forEach((input, i) => {
  input.value = CONFIG.paletaColores[i] || '';
  input.oninput = leerPaleta;
});
leerPaleta();
document.querySelectorAll('#modo button').forEach(b => b.onclick = () => mostrarSeccion(b.dataset.modo));
// cambiar el grosor vuelve a tejer el mismo patrón
document.getElementById('grosor').onchange = () => { leerGrosor(); background(CONFIG.colorFondo); tejer(); };
document.getElementById('bAleatorio').onclick = generarAleatorio;
document.getElementById('bExacto').onclick = generarExacto;
document.getElementById('bTile').onclick = guardarTile;
document.getElementById('bCompleto').onclick = guardarCompleto;

function keyPressed() {
  if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
  const tecla = key.toLowerCase();
  if (tecla === 'r') generar();
  if (tecla === 'g') guardarCompleto();
  if (tecla === 't') guardarTile();
}
</script>
</body>
</html>
