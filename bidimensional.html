<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telar euclidiano</title>
  <style>
    body { margin: 0; background: #efe6d2; }
    canvas { display: block; }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>
<script>
// =====================================================
// TELAR EUCLIDIANO (p5.js)
// cada 1 = color siguiente · los 0 siguen el color de ese 1
// urdimbre y trama usan la misma secuencia
// animación: urdimbres crecen de arriba hacia abajo,
// después tramas crecen de derecha a izquierda en tafetán
// Teclas: R nueva receta · G guardar png
// =====================================================

const CONFIG = {
  nHilos: 100,         // cantidad de hilos por dirección
  grosor: 4,           // px por hilo
  nColores: 3,         // colores que alternan
  nMin: 2,             // rango de n
  nMax: 13,
  tiempoHilo: 10,      // ms que tarda cada hilo en crecer
  margen: 30,
};

const PALETA = ['#cadcff', '#efa5e4', '#d8f707', '#8a5a2b'];
const FONDO = '#efe6d2';
const TEXTO = '#585050';

let ANCHO, ALTO;
let colores, patron;
let fase, hilo, t0;   // fase: 'urdimbre' | 'trama' | 'fin'

// ---------- EUCLIDES ----------
// fórmula modular: en el paso i va un 1 si (i * k) % n < k, si no un 0
// reparte k unos en n pasos lo más parejo posible · E(3,8) = 10010010
function Euclides(k, n) {
  const secuencia = [];
  for (let i = 0; i < n; i++) secuencia.push((i * k) % n < k ? 1 : 0);
  return secuencia;
}

// ---------- RECETA ----------
function Patron() {
  const n = floor(random(CONFIG.nMin, CONFIG.nMax + 1));
  const k = floor(random(1, n));            // 1 a n - 1
  return { k, n, secuencia: Euclides(k, n) };
}

// 1000101000 → 1000 color 1 · 10 color 2 ...
function ColoresHilos(p, total) {
  const hilos = [];
  let colorActual = -1;                     // el primer 1 lo lleva a 0
  let Indice = 0;
  while (Indice < total) {
    if (p.secuencia[Indice % p.n] === 1) colorActual = (colorActual + 1) % CONFIG.nColores;
    hilos[Indice] = colores[colorActual];
    Indice++;
  }
  return hilos;
}

function NuevaReceta() {
  colores = shuffle(PALETA).slice(0, CONFIG.nColores);
  const p = Patron();
  patron = { ...p, hilos: ColoresHilos(p, CONFIG.nHilos) };

  fase = 'urdimbre';
  hilo = 0;
  t0 = millis();
  loop();
}

// ---------- p5 ----------
function setup() {
  ANCHO = CONFIG.nHilos * CONFIG.grosor;
  ALTO = CONFIG.nHilos * CONFIG.grosor;
  createCanvas(ANCHO + 2 * CONFIG.margen, ALTO + 2 * CONFIG.margen + 30);
  textFont('monospace');
  noStroke();
  NuevaReceta();
}

function draw() {
  background(FONDO);
  const g = CONFIG.grosor, m = CONFIG.margen;
  const progreso = constrain((millis() - t0) / CONFIG.tiempoHilo, 0, 1);

  // URDIMBRES: crecen de arriba hacia abajo
  const nU = fase === 'urdimbre' ? hilo : CONFIG.nHilos;
  for (let i = 0; i < nU; i++) {
    fill(patron.hilos[i]);
    rect(m + i * g, m, g, ALTO);
  }
  if (fase === 'urdimbre') {
    fill(patron.hilos[hilo]);
    rect(m + hilo * g, m, g, ALTO * progreso);
  }

  // TRAMAS: crecen de derecha a izquierda, tafetán
  const nT = fase === 'trama' ? hilo : fase === 'fin' ? CONFIG.nHilos : 0;
  for (let j = 0; j < nT; j++) dibujarTrama(j, 1);
  if (fase === 'trama') dibujarTrama(hilo, progreso);

  leyenda(m, m + ALTO + 20);

  // avanzar al siguiente hilo
  if (fase !== 'fin' && progreso >= 1) {
    hilo++;
    t0 = millis();
    if (fase === 'urdimbre' && hilo >= CONFIG.nHilos) { fase = 'trama'; hilo = 0; }
    else if (fase === 'trama' && hilo >= CONFIG.nHilos) { fase = 'fin'; noLoop(); }
  }
}

// trama j: solo se pinta en los cruces donde va adelante
function dibujarTrama(j, progreso) {
  const g = CONFIG.grosor, m = CONFIG.margen;
  const x0 = m + ANCHO * (1 - progreso);    // borde izquierdo de lo que ya entró
  fill(patron.hilos[j]);
  for (let i = 0; i < CONFIG.nHilos; i++) {
    if ((j + i) % 2 === 0) continue;        // urdimbre adelante
    const a = max(m + i * g, x0);
    const b = m + (i + 1) * g;
    if (b > a) rect(a, m + j * g, b - a, g);
  }
}

// una vuelta de la secuencia: casilla = color, punto = 1
function leyenda(x, y) {
  const x0 = x + 130;
  const s = min(14, (width - x0 - CONFIG.margen) / patron.n - 2);

  fill(TEXTO);
  textSize(11);
  text(`E(${patron.k},${patron.n})`, x, y + 10);

  for (let i = 0; i < patron.n; i++) {
    const cx = x0 + i * (s + 2);
    fill(patron.hilos[i]);
    rect(cx, y, s, 14);
    fill(TEXTO);
    if (patron.secuencia[i]) circle(cx + s / 2, y + 7, min(4, s * 0.6));
  }
}

// ---------- GUARDAR ----------
function descargar(canvasEl, nombre) {
  const link = document.createElement('a');
  link.download = nombre + '.png';
  link.href = canvasEl.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function keyPressed() {
  const k = key.toLowerCase();
  if (k === 'r') NuevaReceta();
  if (k === 'g') descargar(drawingContext.canvas, 'telar-euclidiano');
}
</script>
</body>
</html>
