<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telar euclidiano</title>
  <style>
    body { margin: 0; background: #efe6d2; }
    canvas { display: block; }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>
<script>
// =====================================================
// TELAR EUCLIDIANO (p5.js)
// cada 1 = color siguiente · los 0 siguen el color de ese 1
// urdimbre y trama con patrón propio, compartido o al azar
// animación: urdimbres crecen de arriba hacia abajo,
// después tramas crecen de derecha a izquierda en tafetán
// Teclas: R nueva receta · G guardar png · T guardar tile repetible
// =====================================================

const CONFIG = {
  nHilos: 100,         // hilos por dirección
  grosor: 4,           // px por hilo
  nColores: 3,         // colores que alternan
  nMin: 2,             // rango de n
  nMax: 13,
  modo: 'aleatorio',   // 'igual' | 'distinto' | 'aleatorio'
  tiempoHilo: 10,     // ms que tarda cada hilo en crecer
  margen: 30,
};

const PALETA = ['#cadcff', '#efa5e4', '#d8f707', '#8a5a2b'];
const FONDO = '#efe6d2';
const TEXTO = '#585050';

let ANCHO, ALTO;
let colores, urdimbre, trama, comparten;
let fase, hilo, t0;   // fase: 'urdimbre' | 'trama' | 'fin'

// ---------- EUCLIDES ----------
function Euclides(k, n) {
  let a = Array.from({ length: k }, () => [1]);
  let b = Array.from({ length: n - k }, () => [0]);
  while (b.length > 1) {
    const m = min(a.length, b.length);
    const unidos = [];
    for (let i = 0; i < m; i++) unidos.push(a[i].concat(b[i]));
    b = a.length > m ? a.slice(m) : b.slice(m);
    a = unidos;
  }
  return a.concat(b).flat();
}

function mcd(a, b) {
  while (b) [a, b] = [b, a % b];
  return a;
}

function mcm(a, b) {
  return a * b / mcd(a, b);
}

// hilos hasta que el color vuelve al inicio
function periodo(S) {
  return S.n * CONFIG.nColores / mcd(S.k, CONFIG.nColores);
}

// ---------- RECETA ----------
function Patron() {
  const n = floor(random(CONFIG.nMin, CONFIG.nMax + 1));
  const k = floor(random(1, n));            // 1 a n - 1
  return { k, n, secuencia: Euclides(k, n) };
}

// 1000101000 → 1000 color 1 · 10 color 2 ...
function ColoresHilos(p, total) {
  const hilos = [];
  let colorActual = -1;                     // el primer 1 lo lleva a 0
  let Indice = 0;
  while (Indice < total) {
    if (p.secuencia[Indice % p.n] === 1) colorActual = (colorActual + 1) % CONFIG.nColores;
    hilos[Indice] = colores[colorActual];
    Indice++;
  }
  return hilos;
}

function NuevaReceta() {
  colores = shuffle(PALETA).slice(0, CONFIG.nColores);
  const pU = Patron();
  comparten = CONFIG.modo === 'igual' || (CONFIG.modo === 'aleatorio' && random() < 0.5);
  const pT = comparten ? pU : Patron();
  urdimbre = { ...pU, hilos: ColoresHilos(pU, CONFIG.nHilos) };
  trama = { ...pT, hilos: ColoresHilos(pT, CONFIG.nHilos) };

  fase = 'urdimbre';
  hilo = 0;
  t0 = millis();
  loop();
}

// ---------- p5 ----------
function setup() {
  ANCHO = CONFIG.nHilos * CONFIG.grosor;
  ALTO = CONFIG.nHilos * CONFIG.grosor;
  createCanvas(ANCHO + 2 * CONFIG.margen, ALTO + 2 * CONFIG.margen + 80);
  textFont('monospace');
  noStroke();
  NuevaReceta();
}

function draw() {
  background(FONDO);
  const g = CONFIG.grosor, m = CONFIG.margen;
  const progreso = constrain((millis() - t0) / CONFIG.tiempoHilo, 0, 1);

  // URDIMBRES: crecen de arriba hacia abajo
  const nU = fase === 'urdimbre' ? hilo : CONFIG.nHilos;
  for (let i = 0; i < nU; i++) {
    fill(urdimbre.hilos[i]);
    rect(m + i * g, m, g, ALTO);
  }
  if (fase === 'urdimbre') {
    fill(urdimbre.hilos[hilo]);
    rect(m + hilo * g, m, g, ALTO * progreso);
  }

  // TRAMAS: crecen de derecha a izquierda, tafetán
  const nT = fase === 'trama' ? hilo : fase === 'fin' ? CONFIG.nHilos : 0;
  for (let j = 0; j < nT; j++) dibujarTrama(j, 1);
  if (fase === 'trama') dibujarTrama(hilo, progreso);

  leyenda('URDIMBRE', urdimbre, m, m + ALTO + 20);
  leyenda('TRAMA   ', trama, m, m + ALTO + 45);
  fill(TEXTO);
  const t = tamañoTile();
  text(`${comparten ? 'comparten patrón' : 'patrones distintos'} · tile ${t.w}x${t.h} hilos`, m, m + ALTO + 80);

  // avanzar al siguiente hilo
  if (fase !== 'fin' && progreso >= 1) {
    hilo++;
    t0 = millis();
    if (fase === 'urdimbre' && hilo >= CONFIG.nHilos) { fase = 'trama'; hilo = 0; }
    else if (fase === 'trama' && hilo >= CONFIG.nHilos) { fase = 'fin'; noLoop(); }
  }
}

// trama j: solo se pinta en los cruces donde va adelante
function dibujarTrama(j, progreso) {
  const g = CONFIG.grosor, m = CONFIG.margen;
  const x0 = m + ANCHO * (1 - progreso);    // borde izquierdo de lo que ya entró
  fill(trama.hilos[j]);
  for (let i = 0; i < CONFIG.nHilos; i++) {
    if ((j + i) % 2 === 0) continue;        // urdimbre adelante
    const a = max(m + i * g, x0);
    const b = m + (i + 1) * g;
    if (b > a) rect(a, m + j * g, b - a, g);
  }
}

// período completo: casilla = color, punto = 1, línea = reinicio de secuencia
function leyenda(nombre, S, x, y) {
  const largo = min(periodo(S), CONFIG.nHilos);
  const x0 = x + 130;
  const s = min(14, (width - x0 - CONFIG.margen) / largo - 2);

  fill(TEXTO);
  textSize(11);
  text(`${nombre} E(${S.k},${S.n})`, x, y + 10);

  for (let i = 0; i < largo; i++) {
    const cx = x0 + i * (s + 2);
    fill(S.hilos[i]);
    rect(cx, y, s, 14);
    fill(TEXTO);
    if (S.secuencia[i % S.n]) circle(cx + s / 2, y + 7, min(4, s * 0.6));
    if (i > 0 && i % S.n === 0) rect(cx - 2, y - 3, 1, 20);
  }
}

// ---------- GUARDAR ----------
function descargar(canvasEl, nombre) {
  const link = document.createElement('a');
  link.download = nombre + '.png';
  link.href = canvasEl.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// ancho = mcm(período urdimbre, 2) · alto = mcm(período trama, 2)
// el 2 es por el tafetán (ajedrez)
function tamañoTile() {
  return { w: mcm(periodo(urdimbre), 2), h: mcm(periodo(trama), 2) };
}

function GuardarTile() {
  const { w, h } = tamañoTile();
  const g = CONFIG.grosor;
  const colU = ColoresHilos(urdimbre, w);   // colores recalculados al largo del tile
  const colT = ColoresHilos(trama, h);

  const pg = createGraphics(w * g, h * g);
  pg.pixelDensity(1);                       // 1 px real = 1 px
  pg.noStroke();
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      pg.fill((i + j) % 2 === 0 ? colU[i] : colT[j]);
      pg.rect(i * g, j * g, g, g);
    }
  }
  descargar(pg.elt, `tile-${w}x${h}`);
  pg.remove();
}

function keyPressed() {
  const k = key.toLowerCase();
  if (k === 'r') NuevaReceta();
  if (k === 'g') descargar(drawingContext.canvas, 'telar-euclidiano');
  if (k === 't') GuardarTile();
}
</script>
</body>
</html>
