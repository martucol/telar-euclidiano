<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telar euclidiano</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #efe6d2;
    }
    canvas { display: block; }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>

<script>
// =====================================================
// TELAR EUCLIDIANO (p5.js)
// Bidimensional, interacalado alternadamente, con acentos.
// =====================================================

/*
Combinaciones que me gustaron:
- urdimbre E(2,4) E(1,2) 2010 · colores #8a5a2b #d8f707 #b1d1f5
- urdimbre E(25,27) E(9,25) 201121211211210121211211211 · colores #d8f707 #b1d1f5 #efa5e4 -> esta me hizo ilusion optica
- urdimbre E(1,6) 100000 · colores #b1d1f5 #d8f707 #8a5a2b -> bonita y simple
*/

const CONFIG = {
  grosor: 16,           // px por "hilo". la cantidad de "hilos" horizontales y verticales se calcula a partir del alto / ancho de pantalla
  nColores: 3,          // se eligen aleatoriamente de la paleta, 1 para el acento, el resto para la base
  nMin: 3,              // minimo valor para n, como minimo 3 porque k tiene que ser al menos 2 para que haya acento
  nMax: 29,             // maximo valor para n
  tiempoHilo: 50,       // ms que tarda cada hilo en dibujarse
  espera: 3000,         // ms de pausa entre un patrón y el siguiente
};

const PALETA = ['#b1d1f5', '#efa5e4', '#d8f707', '#8a5a2b'];
const FONDO = '#efe6d2';

let colores, patron, urdimbre, trama;   // urdimbre y trama: colores de cada hilo, mismo patrón
let fase, hilo, t0;   // fase: 'urdimbre' | 'trama' | 'espera'

// ---------- EUCLIDES ----------
// 
// fórmula modular: en el paso i va un 1 si (i * k) % n < k, si no un 0
// reparte k unos en n pasos lo más parejo posible · E(3,8) = 10010010
function euclides(k, n) {
  const secuencia = [];
  for (let i = 0; i < n; i++) secuencia.push((i * k) % n < k ? 1 : 0);
  return secuencia;
}

// ---------- ACENTO ----------
// principal E(k,n), acento E(a,k): el acento se reparte sobre los k unos
// los unos que caen en un 1 del acento pasan a 2 · E(3,8) con E(1,3) = 20010010
function acento(secuencia, k, a) {
  const acento = euclides(a, k);
  let uno = 0;                              // cuántos 1 van recorridos
  return secuencia.map(x => x === 1 ? (acento[uno++] ? 2 : 1) : 0);
}

// ----------GENERADOR DE PATRÓN ----------
function patron() {
  const n = floor(random(CONFIG.nMin, CONFIG.nMax + 1));
  const k = floor(random(2, n));            // 2 a n - 1
  const a = floor(random(1, k));            // 1 a k - 1
  return { k, n, a, secuencia: acento(euclides(k, n), k, a) };
}

// ---------- COLORES ----------
// 1 → siguiente color base · 2 → color acento · 0 → mantiene el último color
// con 3 colores: 20010010 → 200 acento · 100 base 1 · 10 base 2
function coloresHilos(p, total) {
  const nBase = CONFIG.nColores - 1;        // colores base: todos menos el último
  const acento = CONFIG.nColores - 1;       // color acento: el último
  const hilos = [];
  let colorBase = -1;                       // el primer 1 lo lleva a 0
  let colorActual = -1;
  let Indice = 0;
  while (Indice < total) {
    const paso = p.secuencia[Indice % p.n];
    if (paso === 1) {
      colorBase = (colorBase + 1) % nBase;
      colorActual = colorBase;
    }
    if (paso === 2) colorActual = acento;
    hilos[Indice] = colores[colorActual];
    Indice++;
  }
  return hilos;
}

// urdimbre y trama usan el mismo patrón
// el patrón se repite hasta cubrir la pantalla
function nuevoPatron() {
  colores = shuffle(PALETA).slice(0, CONFIG.nColores);
  patron = patron();
  urdimbre = coloresHilos(patron, ceil(width / CONFIG.grosor));
  trama = coloresHilos(patron, ceil(height / CONFIG.grosor));
  fase = 'urdimbre';
  hilo = 0;
  t0 = millis();
}

// patrón terminado → consola
function registrar() {
  const p = patron;
  console.log(
    `E(${p.k},${p.n}) E(${p.a},${p.k}) ${p.secuencia.join('')}` +
    ` · colores ${colores.join(' ')}`
  );
}

// ---------- p5 ----------
function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();
  background(FONDO);
  nuevoPatron();
}

// al cambiar el tamaño se limpia y arranca de nuevo
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(FONDO);
  nuevoPatron();
}

// sin background(): cada frame pinta solo el hilo que está creciendo
function draw() {
  if (fase === 'espera') {
    if (millis() - t0 >= CONFIG.espera) nuevoPatron();
    return;
  }

  const g = CONFIG.grosor;
  const progreso = constrain((millis() - t0) / CONFIG.tiempoHilo, 0, 1);

  // URDIMBRES: crecen de arriba hacia abajo
  if (fase === 'urdimbre') {
    fill(urdimbre[hilo]);
    rect(hilo * g, 0, g, height * progreso);
  }

  // TRAMAS: crecen de derecha a izquierda, tafetán
  if (fase === 'trama') dibujarTrama(hilo, progreso);

  // avanzar al siguiente hilo
  if (progreso >= 1) {
    hilo++;
    t0 = millis();
    if (fase === 'urdimbre' && hilo >= urdimbre.length) { fase = 'trama'; hilo = 0; }
    else if (fase === 'trama' && hilo >= trama.length) { fase = 'espera'; Registrar(); }
  }
}

// trama j: solo se pinta en los cruces donde va adelante
function dibujarTrama(j, progreso) {
  const g = CONFIG.grosor;
  const x0 = width * (1 - progreso);        // borde izquierdo de lo que ya entró
  fill(trama[j]);
  for (let i = 0; i < urdimbre.length; i++) {
    if ((j + i) % 2 === 0) continue;        // urdimbre adelante
    const a = max(i * g, x0);
    const b = (i + 1) * g;
    if (b > a) rect(a, j * g, b - a, g);
  }
}

// ---------- GUARDAR ----------
function descargar(canvasEl, nombre) {
  const link = document.createElement('a');
  link.download = nombre + '.png';
  link.href = canvasEl.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// k,n,a en el nombre: 5,8,a2
function nombreArchivo(extra) {
  const p = patron;
  return `telar-euclidiano${extra}-${p.k},${p.n},a${p.a}`;
}

// guarda lo que está en pantalla tal cual
function guardarCompleto() {
  descargar(drawingContext.canvas, nombreArchivo(''));
}

function keyPressed() {
  if (key.toLowerCase() === 'g') guardarCompleto();
}
</script>
</body>
</html>
